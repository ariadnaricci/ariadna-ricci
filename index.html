        body {

            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .contenedor {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(128, 128, 128, 0.2);
            padding: 45px 30px;
            max-width: 420px;

            margin-bottom: 8px;
        }
        .subtitulo {
            color: #808080;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .boton-telegram {
            background: linear-gradient(135deg, #6A5ACD, #9370DB);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            display: block;
            margin-bottom: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .boton-telegram:hover {

        }

        .instruccion {

            font-size: 14px;

        }

        .redes-titulo {

            font-size: 17px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .redes {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .red {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0E6FA;
            color: #555555;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            transition: background 0.3s;
        }
        .red:hover {
            background: #D8BFD8;
        }
        .icono {
            margin-right: 10px;
            font-size: 20px;
        }
    </style>
</head>
